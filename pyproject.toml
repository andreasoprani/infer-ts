[build-system]
requires = ["maturin>=1.0,<2"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/abi3"]
module-name = "infer_ts._infer_ts"
python-source = "python"
strip = true

[project]
name = "infer-ts"
version = "0.1.0"
description = "Infer timestamp formats from string columns using CSP constraint elimination"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["polars>=0.52"]

[project.optional-dependencies]
dev = ["pyarrow", "pytest"]

[dependency-groups]
dev = [
    "basedpyright>=1.37.4",
    "pyarrow>=21.0.0",
]

[tool.pyright]
extraPaths = ["python"]
stubPath = "typings"
