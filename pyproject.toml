[build-system]
requires = ["maturin>=1.0,<2"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/abi3"]
module-name = "infer_ts._infer_ts"
python-source = "python"
strip = true

[project]
name = "infer-ts"
dynamic = ["version"]
description = "Infer timestamp formats from string columns using CSP constraint elimination"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Andrea Soprani" },
]
keywords = ["polars", "datetime", "timestamp", "inference", "parsing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["polars>=1.0"]

[project.urls]
Homepage = "https://github.com/andreasoprani/infer-ts"
Repository = "https://github.com/andreasoprani/infer-ts"
Issues = "https://github.com/andreasoprani/infer-ts/issues"

[dependency-groups]
dev = [
    "basedpyright>=1.37.4",
    "pyarrow>=21.0.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (1M-row datasets, timing assertions)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["infer_ts"]

[tool.pyright]
extraPaths = ["python"]
stubPath = "typings"
reportAny = "none"
reportExplicitAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportPrivateUsage = "none"
reportUnusedCallResult = "none"
